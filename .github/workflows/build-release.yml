name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify gradle wrapper
      run: |
        echo "=== Checking gradle wrapper ==="
        ls -la gradle/wrapper/
        file gradle/wrapper/gradle-wrapper.jar
        java -jar gradle/wrapper/gradle-wrapper.jar --version 2>&1 || true
        echo "=== gradlew dry run ==="
        ./gradlew --version 2>&1

    - name: Decode keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

    - name: Build Signed Release APK
      env:
        RELEASE_KEYSTORE_PATH: release.jks
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace

    - name: List APK files
      run: |
        echo "=== Looking for APK files ==="
        find app/build/outputs -name "*.apk" -ls 2>/dev/null || echo "No APK found in outputs"
        ls -laR app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"

    - name: Upload Release APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Attach APK to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
